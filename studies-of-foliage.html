    <script>
        const photoSections = document.querySelectorAll('.photo.fade-in');
        const observer = new IntersectionObserver(
            (entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            },
            { threshold: 0.15 }
        );

        photoSections.forEach(section => observer.observe(section));
    </script>

    <script>
        
        document.addEventListener('contextmenu', function(e) {
            if (e.target.tagName === 'IMG' || e.target.closest('.photo')) {
                e.preventDefault();
                return false;
            }
        });

        
        document.addEventListener('dragstart', function(e) {
            if (e.target.tagName === 'IMG') {
                e.preventDefault();
                return false;
            }
        });

        
        document.addEventListener('keydown', function(e) {
            
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'a' || e.key === 'p' || e.key === 'u' || e.key === 'i')) {
                e.preventDefault();
                return false;
            }
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                e.preventDefault();
                return false;
            }
        });

        
        document.querySelectorAll('.photo img').forEach(img => {
            img.onselectstart = function() { return false; };
            img.onmousedown = function() { return false; };
        });
    </script>
